<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content=" The Contact us page for the Leak-Eeze White water rafting company">
    <meta name="author" content="Brendin Sauer">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us at Leak-Eeze White Water Rafting</title>
</head>

<body>
    <header>
        <img src="images/logo.png">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>
        <div class="address">
            <h2>Leak-Eeze White Water Rafting</h2>
            <h3>123 Main River Street</h3>
            <h3>Kolob, California</h3>
            <h3>+1 999 999 9999</h3>
            <h3>info@whitewater.com</h3>
        </div>

        <div class="main_section">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d114964.38937865479!2d-80.30779437595842!3d25.78254537233189!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x88d9b0a20ec8c111%3A0xff96f271ddad4f65!2sMiami%2C%20FL!5e0!3m2!1sen!2sus!4v1771108199471!5m2!1sen!2sus"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>


            <form>

                <!-- the user's name -->
                <label for="name" class="inline">Name</label>
                <input type="text" id="name" name="name" class="inline">

                <!-- the user's email address -->
                <label for="email" class="block"> Email</label>
                <input type="email" id="email" name="email">

                <!-- the purpose of the message -->
                <p>Message Purpose</p>
                <input type="radio" id="purpose" name="purpose">
                <label for="purpose" class="inline">General Inquiry</label>
                <input type="radio" id="reservation" name="purpose">
                <label for="reservation" class="inline">Reservation Question</label>
                <input type="radio" id="suggestion" name="purpose">
                <label for="suggestion" class="inline">Website Suggestion</label>

                <!-- the message -->
                <label for="mesage" class="inline">Message</label>
                <textarea type="text" id="message" name="message" rows="4"
                  class="inline"></textarea>

                <!-- a checkbox
                    labeled "Please subscribe me to the monthly newsletter" a properly styled, and
                    labeled submission button with type set to submit. -->
                <input type="checkbox" id="subscribe" name="subscribe">
                <label for="subscribe" class="inline">Please subscribe to me for the monthly
                    newsletter</label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="adventure contact">
            <h2>Adventure Awaits You!</h2>
            <div class="employee">
                <figure>
                    <img src="images/clearcreekcounty.jpg" alt="clearcreekcounty">
                    <figcaption>Clear Creak County</figcaption>
                </figure>

                <figure>
                    <img src="images/jacksonhole.jpeg" alt="jacksonhole">
                    <figcaption>Jackson Hole</figcaption>
                </figure>

                <figure>
                    <img src="images/spokanewa.jpeg" alt="spokane">
                    <figcaption>Spokane, WA</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 &diams; Leaky-Eeze White Water Rafting; Brendin Sauer &diams;</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.svg"></a>
            <a href="https://instagram"><img src="images/instagram.svg"></a>
        </nav>

    </footer>
</body>

</html>
